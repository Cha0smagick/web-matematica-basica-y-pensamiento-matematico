<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curso profesional completo de Matemática Básica y Pensamiento Matemático. Aprende desde cero con método intuitivo, interactivo y sin ansiedad.">
  <meta name="theme-color" content="#2563eb">
  <meta name="color-scheme" content="light dark">
  
  <title>Matemática Básica y Pensamiento Matemático</title>
</head>
<body>
  <div id="app"></div>
  
  <!-- Critical inline script for theme initialization (prevents flash) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
