  <meta name="color-scheme" content="light dark">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Matemática Básica y Pensamiento Matemático - Curso Completo Gratis">
  <meta property="og:description" content="De 'odio las mates' a 'entiendo el mundo' en 20 min/día. Curso interactivo con diploma.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/og-image.png">
  <meta property="og:url" content="https://usuario.github.io/web-matematica-basica-y-pensamiento-matematico/">
  
  <!-- Twitter Card -->

  <meta name="twitter:title" content="Matemática Básica y Pensamiento Matemático">
  <meta name="twitter:description" content="Curso interactivo gratis para principiantes absolutos.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  
  <!-- Preload critical assets (Vite handles modulepreload automatically) -->
  <link rel="preload" as="style" href="/src/styles/globals.css">
  
  <title>Matemática Básica y Pensamiento Matemático</title>
</head>
<body>
  <div id="app"></div>
  <script>
    console.log('HTML loaded, app element:', document.getElementById('app'));
    document.getElementById('app').innerHTML = '<h1 style="color: red; font-size: 48px;">TEST: JavaScript is running!</h1>';
    try {
      var s = document.createElement('script');
      s.type = 'module';
      s.textContent = 'console.log("Module script executed!");';
      document.body.appendChild(s);
    } catch(e) {
      console.error('Error:', e);
    }
  </script>
  
  <!-- Critical inline script for theme initialization (prevents flash) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  
  <script type="module" src="/src/main.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
